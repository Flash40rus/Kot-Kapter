<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2FC0FF">
<title>Кот Каптер 🐱</title>
<style>
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#2FC0FF;
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
    touch-action:none;overscroll-behavior:none;
  }
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;}
  #musicBtn{
    position:fixed; top:14px; left:14px; z-index:10;
    width:44px; height:44px; border-radius:50%;
    border:none; background:rgba(255,255,255,0.85);
    font-size:22px; cursor:pointer; padding:0;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    -webkit-tap-highlight-color:transparent;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="musicBtn">🔊</button>
<script>
'use strict';

/* ============================================================
   КОТ КАПТЕР  —  раннер в стиле Chrome Dino, но с котом
   ============================================================ */

const cv  = document.getElementById('game');
const ctx = cv.getContext('2d');

let W = 640, H = 360, S = 1, DPR = 1, GROUND_Y = 280, CATX = 120;

/* ---------- Подгонка под экран ---------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth;
  const ch = window.innerHeight;

  cv.width  = Math.round(cw * DPR);
  cv.height = Math.round(ch * DPR);
  cv.style.width  = cw + 'px';
  cv.style.height = ch + 'px';

  S = Math.min(cw / 640, ch / 300);
  W = cw / S;
  H = ch / S;
  GROUND_Y = H * 0.78;
  CATX = Math.min(Math.max(W * 0.18, 90), 170);

  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  ctx.lineJoin = 'round';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

/* ============================================================
   ПАЛИТРЫ (день → закат → ночь → рассвет)
   ============================================================ */
const PALETTES = [
  { sky1:'#2FC0FF', sky2:'#C8F0FF', sun:'#FFE066', sunGlow:'#FFD43B',
    far:'#A8DFA8', near:'#74C97E', grass:'#86E05A', grassDark:'#4CAF50',
    dirt:'#A1724E', dirtDark:'#7A5238', cloud:'#FFFFFF', star:0 },
  { sky1:'#FF7A45', sky2:'#FFD98A', sun:'#FFF176', sunGlow:'#FFB300',
    far:'#C489B8', near:'#9A63A8', grass:'#E0A0D8', grassDark:'#B06FB0',
    dirt:'#7B4E8A', dirtDark:'#5A3668', cloud:'#FFE8D0', star:0 },
  { sky1:'#0E1440', sky2:'#3B2E6E', sun:'#F2F0D8', sunGlow:'#B9B6E8',
    far:'#2C3A6E', near:'#1E2A52', grass:'#3E6B8A', grassDark:'#2A4A63',
    dirt:'#2A2438', dirtDark:'#1A1626', cloud:'#A9B6DE', star:1 },
  { sky1:'#5B6BFF', sky2:'#FFC7E8', sun:'#FFE1EC', sunGlow:'#FF9EC4',
    far:'#A9BCEE', near:'#8AA0DC', grass:'#93DCC4', grassDark:'#5FBFA6',
    dirt:'#8A7A98', dirtDark:'#665878', cloud:'#FFF2F8', star:0.35 }
];

const _rgbCache = Object.create(null);
function hex2rgb(h) {
  let v = _rgbCache[h];
  if (v) return v;
  v = [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  _rgbCache[h] = v;
  return v;
}
function mix(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return 'rgb(' + Math.round(A[0]+(B[0]-A[0])*t) + ',' +
                  Math.round(A[1]+(B[1]-A[1])*t) + ',' +
                  Math.round(A[2]+(B[2]-A[2])*t) + ')';
}
function getPalette(score) {
  const cycle = score / 350;
  const fi = Math.floor(cycle);
  const i  = ((fi % PALETTES.length) + PALETTES.length) % PALETTES.length;
  const j  = (i + 1) % PALETTES.length;
  let f = cycle - fi;
  f = f * f * (3 - 2 * f);
  const A = PALETTES[i], B = PALETTES[j], out = {};
  for (const k in A) {
    const a = A[k], b = B[k];
    out[k] = (typeof a === 'number') ? a + (b - a) * f : mix(a, b, f);
  }
  return out;
}

/* ============================================================
   ФИЗИКА / КОНСТАНТЫ
   ============================================================ */
const GRAVITY   = 3400;
const JUMP_V    = 1000;
const JUMP2_V   = 880;
const SPEED_MIN = 430;
const SPEED_MAX = 970;

let game = null;
let lastTime = 0;

/* ============================================================
   МУЗЫКА И ЗВУКИ (Web Audio API, без файлов)
   ============================================================ */
let audioCtx = null;
let musicOn = true;
let musicTimer = null;
let musicStep = 0;

const MELODY = [
  523.25, 659.25, 783.99, 659.25,
  587.33, 698.46, 880.00, 698.46,
  659.25, 783.99, 987.77, 783.99,
  587.33, 523.25, 493.88, 392.00
];
const BASS = [
  130.81, 130.81, 146.83, 146.83,
  164.81, 164.81, 146.83, 130.81
];

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) {
    audioCtx = null;
  }
}

function playNote(freq, duration, type, volume, time) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(volume, time + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + duration);
}

function musicTick() {
  if (!audioCtx || !musicOn) return;
  const now = audioCtx.currentTime;
  const step = musicStep % MELODY.length;

  playNote(MELODY[step], 0.13, 'triangle', 0.05, now);

  if (step % 2 === 0) {
    playNote(BASS[(step / 2) % BASS.length], 0.22, 'square', 0.035, now);
  }

  if (step % 4 === 2) {
    const buf = audioCtx.createBuffer(1, 1024, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.3;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.02, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    src.connect(g);
    g.connect(audioCtx.destination);
    src.start(now);
    src.stop(now + 0.05);
  }

  musicStep++;
  musicTimer = setTimeout(musicTick, 140);
}

function startMusic() {
  initAudio();
  if (!audioCtx || musicTimer) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  musicOn = true;
  musicTick();
}

function stopMusic() {
  musicOn = false;
  if (musicTimer) {
    clearTimeout(musicTimer);
    musicTimer = null;
  }
}

function playJumpSound() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  playNote(600, 0.08, 'square', 0.04, now);
  playNote(900, 0.08, 'square', 0.04, now + 0.05);
}

function playHitSound() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  playNote(300, 0.15, 'sawtooth', 0.06, now);
  playNote(180, 0.3, 'sawtooth', 0.06, now + 0.12);
}

function playFishSound() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  playNote(880, 0.08, 'triangle', 0.05, now);
  playNote(1175, 0.1, 'triangle', 0.05, now + 0.06);
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
function reset() {
  game = {
    phase: 'ready',
    t: 0,
    runPhase: 0,
    dist: 0,
    score: 0,
    best: parseInt(localStorage.getItem('kotKapterBest') || '0', 10),
    newBest: false,
    speed: SPEED_MIN,
    scroll: 0,
    spawnT: 1.0,
    fishT: 2.2,
    overT: 0,
    jumpBuf: 0,
    shake: 0,
    cat: { h: 0, vy: 0, onGround: true, jumps: 0, squash: 0, blink: 0, nextBlink: 2 },
    obstacles: [],
    fishes: [],
    parts: [],
    clouds: [],
    stars: []
  };
  buildSky();
}

function buildSky() {
  game.clouds = [];
  for (let i = 0; i < 12; i++) {
    game.clouds.push({
      x: Math.random() * (W + 300) - 150,
      yf: 0.05 + Math.random() * 0.62,
      s: 0.55 + Math.random() * 0.95,
      sp: 0.05 + Math.random() * 0.13
    });
  }
  game.stars = [];
  for (let i = 0; i < 45; i++) {
    game.stars.push({
      x: Math.random() * W,
      yf: Math.random() * 0.62,
      r: 0.7 + Math.random() * 1.7,
      tw: Math.random() * 6.283
    });
  }
}

/* ============================================================
   СПАВН
   ============================================================ */
function spawnObstacle() {
  const r = Math.random();
  let ob;
  if (r < 0.34) {
    ob = { type:'cuke',  w: 26, h: 46, y: 0 };
  } else if (r < 0.58) {
    ob = { type:'cuke',  w: 28, h: 68, y: 0 };
  } else if (r < 0.78) {
    ob = { type:'cuke2', w: 60, h: 46, y: 0 };
  } else {
    ob = { type:'bird',  w: 40, h: 28, y: 30 + Math.random() * 26 };
  }
  ob.x = W + 60;
  ob.seed = Math.random() * 100;
  game.obstacles.push(ob);
}

function spawnFish() {
  game.fishes.push({
    x: W + 60,
    y: 70 + Math.random() * 90,
    w: 30, h: 18,
    seed: Math.random() * 10
  });
}

function spawnDust(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    game.parts.push({
      x: x + (Math.random() - 0.5) * 26,
      y: y - Math.random() * 12,
      vx: -70 - Math.random() * 150,
      vy: -30 - Math.random() * 90,
      life: 0.45 + Math.random() * 0.45,
      max: 0.9,
      r: 3 + Math.random() * 6,
      c: color || '#ffffff'
    });
  }
}

function spawnRing(x, y) {
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * 6.283;
    game.parts.push({
      x: x, y: y,
      vx: Math.cos(a) * 130,
      vy: Math.sin(a) * 130,
      life: 0.35, max: 0.35,
      r: 3 + Math.random() * 3,
      c: '#FFF3B0'
    });
  }
}

/* ============================================================
   УПРАВЛЕНИЕ
   ============================================================ */
function pressJump() {
  if (!game) return;
  startMusic();

  if (game.phase === 'ready') {
    game.phase = 'playing';
    game.jumpBuf = 0.12;
    return;
  }
  if (game.phase === 'over') {
    if (game.overT > 0.55) reset();
    return;
  }
  game.jumpBuf = 0.13;
}

function doJump() {
  const c = game.cat;
  if (c.onGround) {
    c.vy = JUMP_V;
    c.onGround = false;
    c.jumps = 1;
    c.h = 0.1;
    spawnDust(CATX, GROUND_Y, 6, '#E8D9B0');
    playJumpSound();
  } else if (c.jumps < 2) {
    c.vy = JUMP2_V;
    c.jumps = 2;
    spawnRing(CATX, GROUND_Y - c.h);
    playJumpSound();
  }
}

cv.addEventListener('pointerdown', e => { e.preventDefault(); pressJump(); }, { passive: false });
cv.addEventListener('touchstart',  e => { e.preventDefault(); }, { passive: false });

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
    e.preventDefault();
    if (!e.repeat) pressJump();
  }
});

/* ============================================================
   ОБНОВЛЕНИЕ
   ============================================================ */
function update(dt) {
  const g = game;
  const c = g.cat;
  g.t += dt;

  const spd = g.phase === 'playing' ? g.speed
            : g.phase === 'ready'   ? 210
            : 0;

  if (g.phase === 'playing') {
    g.dist  += g.speed * dt;
    g.speed  = Math.min(SPEED_MIN + g.dist / 100, SPEED_MAX);
    g.score  = Math.floor(g.dist / 25);
    if (g.score > g.best) { g.best = g.score; g.newBest = true; }
  }

  g.scroll   += spd * dt;
  g.runPhase += (spd / 26) * dt;

  g.jumpBuf -= dt;
  if (g.jumpBuf > 0 && c.onGround && g.phase === 'playing') {
    g.jumpBuf = 0;
    doJump();
  }

  if (g.phase !== 'over') {
    const wasAir = !c.onGround;
    c.vy -= GRAVITY * dt;
    c.h  += c.vy * dt;

    if (c.h <= 0) {
      c.h = 0; c.vy = 0;
      if (wasAir) {
        c.squash = 1;
        spawnDust(CATX, GROUND_Y, 7, '#E8D9B0');
      }
      c.onGround = true;
      c.jumps = 0;
    } else {
      c.onGround = false;
    }
  }
  c.squash = Math.max(0, c.squash - dt * 6);

  c.nextBlink -= dt;
  if (c.nextBlink <= 0) { c.blink = 0.12; c.nextBlink = 2 + Math.random() * 4; }
  c.blink = Math.max(0, c.blink - dt);

  for (const cl of g.clouds) {
    cl.x -= (spd * cl.sp + 6) * dt;
    if (cl.x < -180 * cl.s) {
      cl.x = W + 60 + Math.random() * 160;
      cl.yf = 0.05 + Math.random() * 0.62;
      cl.s = 0.55 + Math.random() * 0.95;
    }
  }

  for (let i = g.obstacles.length - 1; i >= 0; i--) {
    const o = g.obstacles[i];
    o.x -= spd * dt;
    if (o.x + o.w < -120) g.obstacles.splice(i, 1);
  }

  for (let i = g.fishes.length - 1; i >= 0; i--) {
    const f = g.fishes[i];
    f.x -= spd * dt;
    if (f.x + f.w < -120) g.fishes.splice(i, 1);
  }

  if (g.phase === 'playing') {
    g.spawnT -= dt;
    if (g.spawnT <= 0) {
      spawnObstacle();
      g.spawnT = 0.85 + Math.random() * 0.8;
    }
    g.fishT -= dt;
    if (g.fishT <= 0) {
      spawnFish();
      g.fishT = 3.5 + Math.random() * 5;
    }
  }

  for (let i = g.parts.length - 1; i >= 0; i--) {
    const p = g.parts[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 420 * dt;
    p.life -= dt;
    if (p.life <= 0) g.parts.splice(i, 1);
  }

  if (g.phase === 'playing') {
    const feet = GROUND_Y - c.h;
    const box = { x: CATX - 18, y: feet - 56, w: 42, h: 56 };

    for (const o of g.obstacles) {
      const ob = { x: o.x + 3, y: GROUND_Y - o.y - o.h, w: o.w - 6, h: o.h };
      if (box.x < ob.x + ob.w && box.x + box.w > ob.x &&
          box.y < ob.y + ob.h && box.y + box.h > ob.y) {
        gameOver();
        break;
      }
    }

    for (let i = g.fishes.length - 1; i >= 0; i--) {
      const f = g.fishes[i];
      const fb = { x: f.x, y: GROUND_Y - f.y - f.h, w: f.w, h: f.h };
      if (box.x < fb.x + fb.w && box.x + box.w > fb.x &&
          box.y < fb.y + fb.h && box.y + box.h > fb.y) {
        g.dist += 900;
        spawnRing(f.x + f.w / 2, GROUND_Y - f.y - f.h / 2);
        playFishSound();
        g.fishes.splice(i, 1);
      }
    }
  }

  if (g.phase === 'over') {
    g.overT += dt;
    g.shake = Math.max(0, g.shake - dt * 3);
  }
}

function gameOver() {
  const g = game;
  g.phase  = 'over';
  g.overT  = 0;
  g.shake  = 1;
  playHitSound();

  const feet = GROUND_Y - g.cat.h;
  spawnDust(CATX, feet, 16, '#FFFFFF');
  spawnRing(CATX, feet - 30);

  if (g.score >= g.best && g.score > 0) {
    g.newBest = true;
    localStorage.setItem('kotKapterBest', String(g.score));
  }
}

/* ============================================================
   РИСОВАНИЕ
   ============================================================ */
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function drawCloud(x, y, s, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x,          y,          22 * s, 0, 6.283);
  ctx.arc(x + 26 * s, y - 9 * s,  17 * s, 0, 6.283);
  ctx.arc(x + 52 * s, y,          19 * s, 0, 6.283);
  ctx.arc(x + 26 * s, y + 9 * s,  20 * s, 0, 6.283);
  ctx.fill();
}

function drawHills(scroll, baseY, amp, step, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  const startX = -step - (((scroll % step) + step) % step);
  let x = startX;
  ctx.moveTo(x, baseY);
  while (x < W + step) {
    ctx.quadraticCurveTo(x + step * 0.5, baseY - amp, x + step, baseY);
    x += step;
  }
  ctx.lineTo(x, H + 10);
  ctx.lineTo(startX, H + 10);
  ctx.closePath();
  ctx.fill();
}

/* ---------- Кот (похож на фото) ---------- */
function drawCat(px, feetY) {
  const c = game.cat;
  const FUR_BASE = '#8B7D6B';
  const FUR_DARK = '#5C4F42';
  const WHITE    = '#FFFFFF';
  const PINK     = '#FFB6C1';
  const DARK     = '#2A1E1E';
  const IRIS     = '#A2C11C';
  const air      = !c.onGround;
  const dead     = game.phase === 'over';

  ctx.save();
  ctx.translate(px, feetY);

  const sq = c.squash;
  ctx.scale(1 + sq * 0.16, 1 - sq * 0.16);

  const bob = air ? 0 : Math.abs(Math.sin(game.runPhase)) * 1.4;
  ctx.translate(0, -bob);

  ctx.lineCap = 'round';

  /* хвост */
  const wag = dead ? 0 : Math.sin(game.t * 9) * 6;
  ctx.strokeStyle = FUR_DARK;
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(-20, -30);
  ctx.quadraticCurveTo(-44, -34 + wag, -42, -60 + wag * 1.2);
  ctx.stroke();

  ctx.fillStyle = WHITE;
  ctx.beginPath();
  ctx.arc(-42, -60 + wag * 1.2, 4.5, 0, 6.283);
  ctx.fill();

  /* лапы */
  ctx.strokeStyle = FUR_BASE;
  ctx.lineWidth = 6;
  const legs = [-15, -5, 9, 18];
  for (let i = 0; i < 4; i++) {
    const lx = legs[i];
    const ph = (i === 0 || i === 3) ? 0 : Math.PI;
    let fx, fy;
    if (air || dead) {
      fx = lx + (i < 2 ? -5 : 8);
      fy = -11 - (i < 2 ? 0 : 5);
    } else {
      const s = Math.sin(game.runPhase + ph);
      fx = lx + s * 6;
      fy = -Math.max(0, Math.cos(game.runPhase + ph)) * 7;
    }
    ctx.beginPath();
    ctx.moveTo(lx, -18);
    ctx.lineTo(fx, fy);
    ctx.stroke();

    ctx.fillStyle = WHITE;
    ctx.beginPath();
    ctx.arc(fx, fy, 4, 0, 6.283);
    ctx.fill();
  }

  /* тело */
  ctx.fillStyle = FUR_BASE;
  ctx.beginPath();
  ctx.ellipse(0, -30, 26, 17, 0, 0, 6.283);
  ctx.fill();

  ctx.fillStyle = WHITE;
  ctx.beginPath();
  ctx.ellipse(2, -24, 17, 11, 0, 0, 6.283);
  ctx.fill();

  ctx.strokeStyle = FUR_DARK;
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.moveTo(-16, -42); ctx.quadraticCurveTo(-12, -46, -8, -42);
  ctx.moveTo(-6,  -45); ctx.quadraticCurveTo(-2,  -49, 2,  -45);
  ctx.moveTo(4,   -43); ctx.quadraticCurveTo(8,   -47, 12, -43);
  ctx.stroke();

  /* голова */
  ctx.fillStyle = FUR_BASE;
  ctx.beginPath();
  ctx.arc(20, -44, 15, 0, 6.283);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(10, -54); ctx.lineTo(11, -70); ctx.lineTo(24, -57); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(20, -57); ctx.lineTo(32, -69); ctx.lineTo(33, -51); ctx.closePath(); ctx.fill();

  ctx.fillStyle = PINK;
  ctx.beginPath();
  ctx.moveTo(13, -56); ctx.lineTo(14, -66); ctx.lineTo(22, -58); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(22, -58); ctx.lineTo(30, -65); ctx.lineTo(31, -54); ctx.closePath(); ctx.fill();

  /* белая полоска на носу */
  ctx.fillStyle = WHITE;
  ctx.beginPath();
  ctx.moveTo(14, -55);
  ctx.lineTo(22, -55);
  ctx.lineTo(20, -39);
  ctx.lineTo(17, -39);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(28, -39, 11, 9, 0, 0, 6.283);
  ctx.fill();

  /* тёмная "М" на лбу */
  ctx.strokeStyle = FUR_DARK;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(10, -60); ctx.lineTo(15, -55); ctx.lineTo(20, -60);
  ctx.lineTo(25, -55); ctx.lineTo(30, -60);
  ctx.stroke();

  /* глаза */
  if (dead) {
    ctx.strokeStyle = DARK;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(13.5, -50); ctx.lineTo(19.5, -44);
    ctx.moveTo(19.5, -50); ctx.lineTo(13.5, -44);
    ctx.moveTo(25.5, -50); ctx.lineTo(31.5, -44);
    ctx.moveTo(31.5, -50); ctx.lineTo(25.5, -44);
    ctx.stroke();
  } else if (c.blink > 0) {
    ctx.strokeStyle = DARK;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(13.5, -47); ctx.lineTo(19.5, -47);
    ctx.moveTo(25.5, -47); ctx.lineTo(31.5, -47);
    ctx.stroke();
  } else {
    ctx.fillStyle = IRIS;
    ctx.beginPath(); ctx.ellipse(16.5, -47, 3.8, 4.8, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(28.5, -47, 3.8, 4.8, 0, 0, 6.283); ctx.fill();

    ctx.fillStyle = DARK;
    ctx.beginPath(); ctx.ellipse(16.5, -47, 1.8, 3.8, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(28.5, -47, 1.8, 3.8, 0, 0, 6.283); ctx.fill();

    ctx.fillStyle = WHITE;
    ctx.beginPath(); ctx.arc(17.5, -48.5, 1.3, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(29.5, -48.5, 1.3, 0, 6.283); ctx.fill();
  }

  /* нос */
  ctx.fillStyle = PINK;
  ctx.beginPath();
  ctx.moveTo(32.5, -42.5);
  ctx.lineTo(37.5, -42.5);
  ctx.lineTo(35,   -39.5);
  ctx.closePath();
  ctx.fill();

  /* усы */
  ctx.strokeStyle = WHITE;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(34, -41); ctx.lineTo(48, -46);
  ctx.moveTo(34, -39); ctx.lineTo(49, -38);
  ctx.moveTo(34, -37); ctx.lineTo(48, -34);
  ctx.stroke();

  ctx.restore();
}

/* ---------- Огурец ---------- */
function drawCucumber(x, y, w, h, seed) {
  const grad = ctx.createLinearGradient(x, 0, x + w, 0);
  grad.addColorStop(0,    '#3E8E41');
  grad.addColorStop(0.45, '#7CCB4A');
  grad.addColorStop(1,    '#2E6B33');

  ctx.fillStyle = grad;
  rr(x, y, w, h, Math.min(w, h) * 0.42);
  ctx.fill();

  ctx.fillStyle = 'rgba(25,70,25,0.4)';
  const cols = Math.max(2, Math.round(w / 9));
  const rows = Math.max(3, Math.round(h / 13));
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      const bx = x + w * (i + 0.5) / cols;
      const by = y + h * (j + 0.6) / rows;
      ctx.beginPath();
      ctx.arc(bx, by, 1.6, 0, 6.283);
      ctx.fill();
    }
  }

  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  rr(x + w * 0.18, y + h * 0.12, w * 0.2, h * 0.55, w * 0.1);
  ctx.fill();

  ctx.fillStyle = '#4E7A2A';
  ctx.beginPath();
  ctx.ellipse(x + w * 0.5, y + 2, w * 0.16, 3.5, 0, 0, 6.283);
  ctx.fill();
}

/* ---------- Голубь ---------- */
function drawBird(x, y, w, h, t) {
  const cx = x + w * 0.55;
  const cy = y + h * 0.5;

  ctx.fillStyle = '#9AA7B8';
  ctx.beginPath();
  ctx.ellipse(cx, cy, w * 0.45, h * 0.42, 0, 0, 6.283);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x + w * 0.22, cy - h * 0.22, h * 0.28, 0, 6.283);
  ctx.fill();

  ctx.fillStyle = '#FFB300';
  ctx.beginPath();
  ctx.moveTo(x + w * 0.1,  cy - h * 0.26);
  ctx.lineTo(x - w * 0.06, cy - h * 0.14);
  ctx.lineTo(x + w * 0.1,  cy - h * 0.04);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#22303F';
  ctx.beginPath();
  ctx.arc(x + w * 0.22, cy - h * 0.28, 1.7, 0, 6.283);
  ctx.fill();

  const flap = Math.sin(t * 16) * 0.9;
  ctx.fillStyle = '#7C8A9E';
  ctx.beginPath();
  ctx.ellipse(cx, cy + flap * 3, w * 0.3, h * 0.2, flap * 0.4, 0, 6.283);
  ctx.fill();

  ctx.fillStyle = '#8A98AB';
  ctx.beginPath();
  ctx.moveTo(x + w * 0.92, cy - h * 0.12);
  ctx.lineTo(x + w * 1.06, cy + h * 0.1);
  ctx.lineTo(x + w * 0.9,  cy + h * 0.24);
  ctx.closePath();
  ctx.fill();
}

/* ---------- Рыбка ---------- */
function drawFish(x, y, w, h, t) {
  const bob = Math.sin(t * 4.5) * 3;
  y += bob;

  ctx.fillStyle = '#FF8A3D';
  ctx.beginPath();
  ctx.moveTo(x + w * 0.28, y + h * 0.5);
  ctx.lineTo(x - w * 0.08, y + h * 0.05);
  ctx.lineTo(x - w * 0.08, y + h * 0.95);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#FFA94D';
  ctx.beginPath();
  ctx.ellipse(x + w * 0.55, y + h * 0.5, w * 0.42, h * 0.48, 0, 0, 6.283);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.ellipse(x + w * 0.55, y + h * 0.34, w * 0.3, h * 0.13, 0, 0, 6.283);
  ctx.fill();

  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.arc(x + w * 0.78, y + h * 0.42, h * 0.16, 0, 6.283);
  ctx.fill();
  ctx.fillStyle = '#22303F';
  ctx.beginPath();
  ctx.arc(x + w * 0.81, y + h * 0.42, h * 0.08, 0, 6.283);
  ctx.fill();
}

/* ---------- Фон ---------- */
function drawBackground(p) {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, p.sky1);
  g.addColorStop(1, p.sky2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (p.star > 0.02) {
    ctx.fillStyle = '#FFFFFF';
    for (const s of game.stars) {
      ctx.globalAlpha = p.star * (0.45 + 0.55 * Math.abs(Math.sin(game.t * 1.7 + s.tw)));
      ctx.beginPath();
      ctx.arc(s.x, s.yf * GROUND_Y * 0.95, s.r, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  const sx = W * 0.8;
  const sy = Math.min(GROUND_Y * 0.24, 150);
  const sr = Math.min(W * 0.06, 42) + 8;

  ctx.globalAlpha = 0.28;
  ctx.fillStyle = p.sunGlow;
  ctx.beginPath(); ctx.arc(sx, sy, sr * 2.1, 0, 6.283); ctx.fill();
  ctx.globalAlpha = 0.45;
  ctx.beginPath(); ctx.arc(sx, sy, sr * 1.5, 0, 6.283); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.fillStyle = p.sun;
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 6.283); ctx.fill();

  for (const cl of game.clouds) {
    drawCloud(cl.x, cl.yf * GROUND_Y, cl.s, p.cloud);
  }

  drawHills(game.scroll * 0.12, GROUND_Y + 4, 90, 260, p.far);
  drawHills(game.scroll * 0.28, GROUND_Y + 4, 55, 170, p.near);
}

function drawGround(p) {
  const dirtH = H - GROUND_Y;

  ctx.fillStyle = p.dirt;
  ctx.fillRect(0, GROUND_Y, W, dirtH + 2);

  ctx.fillStyle = p.dirtDark;
  ctx.fillRect(0, GROUND_Y + Math.min(dirtH * 0.55, 90), W, dirtH);

  const pstep = 150;
  const poff = -(((game.scroll * 0.85) % pstep) + pstep) % pstep;
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  for (let x = poff; x < W + pstep; x += pstep) {
    const yy = GROUND_Y + Math.min(dirtH * 0.35, 46);
    ctx.beginPath(); ctx.arc(x + 30, yy, 6, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 96, yy + 22, 4.5, 0, 6.283); ctx.fill();
  }

  ctx.fillStyle = p.grass;
  ctx.fillRect(0, GROUND_Y, W, 20);
  ctx.fillStyle = p.grassDark;
  ctx.fillRect(0, GROUND_Y + 16, W, 6);

  const step = 96;
  const off = -((game.scroll % step) + step) % step;
  ctx.fillStyle = p.grassDark;
  for (let x = off; x < W + step; x += step) {
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y + 3);
    ctx.quadraticCurveTo(x + 6, GROUND_Y - 12, x + 12, GROUND_Y + 3);
    ctx.fill();
  }
}

/* ---------- HUD ---------- */
function drawHUD(p) {
  const fs = Math.max(18, W * 0.042);

  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';

  const pad = W * 0.035;
  const top = Math.max(14, H * 0.03);

  ctx.font = 'bold ' + fs + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';

  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillText(String(game.score).padStart(5, '0'), W - pad + 2, top + 2);
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(String(game.score).padStart(5, '0'), W - pad, top);

  ctx.font = 'bold ' + (fs * 0.62) + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillText('ЛУЧШИЙ ' + game.best, W - pad + 2, top + fs * 1.35 + 2);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.fillText('ЛУЧШИЙ ' + game.best, W - pad, top + fs * 1.35);
}

function drawReady() {
  const fs = Math.max(20, W * 0.05);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const cy = GROUND_Y * 0.4;

  ctx.font = 'bold ' + (fs * 1.7) + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillText('КОТ КАПТЕР', W / 2 + 3, cy + 3);
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('КОТ КАПТЕР', W / 2, cy);

  const pulse = 0.75 + 0.25 * Math.sin(game.t * 4);
  ctx.globalAlpha = pulse;
  ctx.font = 'bold ' + fs + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('Тапни, чтобы начать', W / 2, cy + fs * 2.1);
  ctx.globalAlpha = 1;

  ctx.font = 'bold ' + (fs * 0.62) + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('Прыжок — тап / пробел  ·  Двойной прыжок', W / 2, cy + fs * 3.2);
}

function drawOver() {
  const fs = Math.max(20, W * 0.05);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const cy = GROUND_Y * 0.4;

  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.fillRect(0, 0, W, H);

  ctx.font = 'bold ' + (fs * 1.35) + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('МЯУ! 💥', W / 2, cy - fs * 0.5);

  ctx.font = 'bold ' + fs + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.fillText('Счёт: ' + game.score, W / 2, cy + fs * 1.1);

  if (game.newBest) {
    ctx.fillStyle = '#FFE066';
    ctx.font = 'bold ' + (fs * 0.8) + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
    ctx.fillText('🏆 НОВЫЙ РЕКОРД!', W / 2, cy + fs * 2.0);
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.font = 'bold ' + (fs * 0.72) + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
    ctx.fillText('Рекорд: ' + game.best, W / 2, cy + fs * 2.0);
  }

  if (game.overT > 0.55) {
    const pulse = 0.7 + 0.3 * Math.sin(game.t * 5);
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#FFFFFF';
    ctx.font = 'bold ' + (fs * 0.85) + 'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
    ctx.fillText('Тапни, чтобы играть снова', W / 2, cy + fs * 3.3);
    ctx.globalAlpha = 1;
  }
}

/* ============================================================
   РЕНДЕР
   ============================================================ */
function render() {
  const g = game;
  const p = getPalette(g.score);

  ctx.save();

  if (g.shake > 0) {
    const s = g.shake * 7;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }

  drawBackground(p);
  drawGround(p);

  for (const o of g.obstacles) {
    const oy = GROUND_Y - o.y - o.h;
    if (o.type === 'cuke') {
      drawCucumber(o.x, oy, o.w, o.h, o.seed);
    } else if (o.type === 'cuke2') {
      drawCucumber(o.x,          oy, o.w * 0.44, o.h,       o.seed);
      drawCucumber(o.x + o.w * 0.52, oy + 4, o.w * 0.44, o.h - 8, o.seed + 3);
    } else {
      const bobY = Math.sin(g.t * 5 + o.seed) * 4;
      drawBird(o.x, oy + bobY, o.w, o.h, g.t + o.seed);
    }
  }

  for (const f of g.fishes) {
    drawFish(f.x, GROUND_Y - f.y - f.h, f.w, f.h, g.t + f.seed);
  }

  for (const pt of g.parts) {
    const a = Math.max(0, pt.life / pt.max);
    ctx.globalAlpha = a * 0.85;
    ctx.fillStyle = pt.c;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r * (0.4 + a * 0.6), 0, 6.283);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const feet = GROUND_Y - g.cat.h;
  drawCat(CATX, feet);

  drawHUD(p);

  if (g.phase === 'ready') drawReady();
  if (g.phase === 'over')  drawOver();

  ctx.restore();
}

/* ============================================================
   ГЛАВНЫЙ ЦИКЛ
   ============================================================ */
function loop(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 1 / 30);

  update(dt);
  render();

  requestAnimationFrame(loop);
}

/* ============================================================
   КНОПКА МУЗЫКИ
   ============================================================ */
document.getElementById('musicBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  if (musicOn) {
    stopMusic();
    e.target.textContent = '🔇';
  } else {
    startMusic();
    e.target.textContent = '🔊';
  }
});

/* ============================================================
   СТАРТ
   ============================================================ */
resize();
reset();
lastTime = performance.now();
requestAnimationFrame(loop);

window.addEventListener('orientationchange', () => {
  setTimeout(() => { if (game && game.phase === 'ready') buildSky(); }, 300);
});
</script>
